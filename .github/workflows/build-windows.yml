# Build the Windows bundle (dist\Dubber-windows.zip) on a Windows runner.
# PyInstaller cannot cross-compile, so the Mac build stays local (scripts/build_exe_mac.sh).
#
# Runs on every push to main-windown-edition, or by hand (Actions → Build Windows → Run).
# The zip is kept as a workflow artifact and, when RELEASE_TAG names an existing
# release of Tin-Puffer/DubberBee-releases, uploaded to it (needs secret RELEASES_TOKEN).
name: Build Windows

on:
  push:
    branches: [main-windown-edition]
  workflow_dispatch:

env:
  RELEASE_TAG: v0.4.1

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FFmpeg (Gyan full build — has libass)
        shell: pwsh
        run: |
          $dst = "$env:RUNNER_TEMP\ffmpeg"
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z -OutFile "$dst.7z"
          7z x "$dst.7z" "-o$dst" -y | Out-Null
          $bin = (Get-ChildItem $dst -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          & "$bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          "FFMPEG_DIR=$bin" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Python packages
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev,offline,vieneu]"

      - name: Models for the tests (not bundled)
        shell: pwsh
        run: .venv\Scripts\python.exe spike\download_models.py --all

      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python.exe -m pytest -q

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_exe.ps1

      - name: Smoke test (frozen app starts and stays up)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Models are downloaded by the app on first run, never bundled
          if (Test-Path "dist\Dubber\_internal\resources\models") { throw "models must not be bundled" }
          # pyvi's word-segmentation model (subtitle line cutting)
          if (-not (Test-Path "dist\Dubber\_internal\pyvi\models\pyvi3.pkl")) { throw "missing in bundle: pyvi model" }
          # Put the downloaded models where the frozen app looks, so it opens the main window
          # (not the first-run download dialog)
          $um = & .venv\Scripts\python.exe -c "from dubber.core.asr.model_manager import _user_models_dir; print(_user_models_dir())"
          $uvr = & .venv\Scripts\python.exe -c "from dubber.core.audio.separate import _uvr_model_dir; print(_uvr_model_dir())"
          New-Item -ItemType Directory -Force $um | Out-Null
          Copy-Item spike\models\* $um -Recurse -Force
          Copy-Item $uvr "$um\uvr" -Recurse -Force
          $p = Start-Process dist\Dubber\Dubber.exe -PassThru
          Start-Sleep -Seconds 45
          if ($p.HasExited) { throw "Dubber.exe exited early (code $($p.ExitCode))" }
          Stop-Process $p -Force
          $log = Get-ChildItem "$env:LOCALAPPDATA\dubber" -Recurse -Filter dubber.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName -Tail 30 }

      - uses: actions/upload-artifact@v4
        with:
          name: Dubber-windows
          path: dist/Dubber-windows.zip
          compression-level: 0
          retention-days: 30

      - name: Upload to release
        shell: pwsh
        env:
          # Releases live in the public DubberBee-releases repo (what installed apps read).
          # GITHUB_TOKEN cannot write there: secret RELEASES_TOKEN = fine-grained token with
          # Contents read/write on Tin-Puffer/DubberBee-releases.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: Tin-Puffer/DubberBee-releases
        run: |
          $size = (Get-Item dist\Dubber-windows.zip).Length
          Write-Host "Zip: $([math]::Round($size / 1MB)) MB"
          if ($size -ge 2GB) { Write-Warning "Zip >= 2 GiB: too big for a release asset (artifact only)"; exit 0 }
          if (-not $env:GH_TOKEN) { Write-Warning "No RELEASES_TOKEN secret - artifact only"; exit 0 }
          gh release view $env:RELEASE_TAG -R $env:RELEASES_REPO *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host "No release $env:RELEASE_TAG in $env:RELEASES_REPO - artifact only"; exit 0 }
          gh release upload $env:RELEASE_TAG dist\Dubber-windows.zip -R $env:RELEASES_REPO --clobber
