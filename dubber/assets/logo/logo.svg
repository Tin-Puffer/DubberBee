<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E3F2FD" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- honeycomb cell -->
  <path d="M256 20 L460 138 Q476 147 476 166 L476 346 Q476 365 460 374 L256 492 L52 374
           Q36 365 36 346 L36 166 Q36 147 52 138 Z" fill="url(#hex)"/>
  <g transform="translate(-26 26)">
  <!-- wings -->
  <ellipse cx="200" cy="168" rx="58" ry="84" transform="rotate(-28 200 168)" fill="url(#wing)"
           stroke="#1B1B1B" stroke-width="10"/>
  <ellipse cx="268" cy="160" rx="50" ry="74" transform="rotate(18 268 160)" fill="url(#wing)"
           stroke="#1B1B1B" stroke-width="10"/>
  <!-- body -->
  <g transform="rotate(-18 222 300)">
    <rect x="128" y="236" width="196" height="128" rx="64" fill="#1B1B1B"/>
    <rect x="176" y="236" width="30" height="128" fill="#FFC107"/>
    <rect x="238" y="236" width="30" height="128" fill="#FFC107"/>
    <circle cx="300" cy="286" r="11" fill="#FFFFFF"/>
  </g>
  <!-- sound waves -->
  <path d="M352 236 Q384 272 352 316" fill="none" stroke="#1B1B1B" stroke-width="18"
        stroke-linecap="round"/>
  <path d="M390 204 Q440 274 390 348" fill="none" stroke="#1B1B1B" stroke-width="18"
        stroke-linecap="round"/>
  </g>
</svg>
